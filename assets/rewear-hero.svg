  <rect x="42" y="38" width="1116" height="364" rx="14" fill="none" stroke="#244C3A" stroke-opacity=".22"/>
  <text x="78" y="91" fill="#244C3A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">REWEAR®  /  CIRCULAR FASHION</text>
