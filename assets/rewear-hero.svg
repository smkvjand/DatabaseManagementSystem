  <text x="76" y="204" fill="#244C3A" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="bold">Good clothes</text>
  <text x="76" y="274" fill="#244C3A" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="bold">deserve a second life.</text>
  <text x="80" y="322" fill="#4D6253" font-family="Arial, Helvetica, sans-serif" font-size="21">Discover. Exchange. Rewear.</text>
