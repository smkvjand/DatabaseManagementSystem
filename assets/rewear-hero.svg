<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">reWear — Good clothes deserve a second life</title>
  <desc id="desc">Minimal editorial-style banner in warm cream and forest green for a sustainable clothing exchange platform.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#E7E8D9"/>
    </linearGradient>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="0.7" fill="#244C3A" opacity=".11"/>
      <circle cx="54" cy="38" r="0.6" fill="#244C3A" opacity=".09"/>
      <circle cx="29" cy="76" r="0.5" fill="#244C3A" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#paper)"/>
